services:
  - type: web
    name: todo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python -m uvicorn todo_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /docs
